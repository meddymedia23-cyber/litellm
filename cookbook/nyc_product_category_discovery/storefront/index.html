<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />
    <meta
      name="description"
      content="Baggies Project — an immersive concept catalog for empty pouches in five size formats."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <title>Baggies Project — Immersive Pouch Catalog</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Baggies Project size collection",
        "description": "An immersive concept catalog for empty pouches.",
        "numberOfItems": 5,
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "item": { "@type": "CreativeWork", "name": "3.5g Empty Pouch Concept" } },
          { "@type": "ListItem", "position": 2, "item": { "@type": "CreativeWork", "name": "7g Empty Pouch Concept" } },
          { "@type": "ListItem", "position": 3, "item": { "@type": "CreativeWork", "name": "14g Empty Pouch Concept" } },
          { "@type": "ListItem", "position": 4, "item": { "@type": "CreativeWork", "name": "28g Empty Pouch Concept" } },
          { "@type": "ListItem", "position": 5, "item": { "@type": "CreativeWork", "name": "1lb Empty Pouch Concept" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main class="no-script">
        <h1>Baggies Project</h1>
        <p>Enable JavaScript to explore the 3D concept catalog.</p>
        <ul>
          <li>3.5g empty pouch concept</li>
          <li>7g empty pouch concept</li>
          <li>14g empty pouch concept</li>
          <li>28g empty pouch concept</li>
          <li>1lb empty pouch concept</li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
